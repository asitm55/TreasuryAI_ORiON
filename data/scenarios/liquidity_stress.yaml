# TreasuryAI synthetic scenario: liquidity_stress
# Same structure as base_case.yaml but with a 30% shock applied to the
# 30-day net cash outflow figure and to every scheduled OUTFLOW payment,
# pushing LCR down to near-breach territory (Basel III minimum is 100%).

scenario: liquidity_stress
description: >
  30% outflow shock applied to base_case. LCR drops to ~107.7% (still
  compliant but near the regulatory minimum); NSFR is unaffected since it
  is a 1-year structural funding metric, not a 30-day liquidity metric.

entities:
  - HoldCo
  - OpCo A
  - OpCo B

currencies:
  - USD
  - EUR
  - GBP
  - JPY
  - CHF

# LCR = hqla / net_cash_outflows_30d = 52,500,000 / 48,750,000 = 1.0769 (107.7%)
# net_cash_outflows_30d = base_case's 37,500,000 * 1.30 = 48,750,000
# NSFR unchanged from base_case: 40,000,000 / 33,700,000 = 1.1869 (118.7%)
hqla: "52500000"
net_cash_outflows_30d: "48750000"
available_stable_funding: "40000000"
required_stable_funding: "33700000"

# Unchanged from base_case: this scenario stresses 30-day liquidity, not
# working capital.
annual_revenue: "180000000"
annual_cogs: "126000000"
accounts_receivable: "24000000"
accounts_payable: "14000000"

