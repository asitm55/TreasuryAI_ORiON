[project]
name = "treasuryai"
version = "0.1.0"
description = "TreasuryAI — a multi-agent AI platform for finance and treasury decision support"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agents*", "tools*", "models*", "core*", "data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
